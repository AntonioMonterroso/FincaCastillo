:root{
  --papel:#F6EFE6;--sup:#FFFBF5;--sup2:#EFE4D6;--tinta:#2B1A10;--tinta2:#6B5444;--tenue:#8C7766;
  --cafe:#6F4E37;--cafe-osc:#553A28;--sobre-cafe:#FFFBF5;--tostado:#3B2416;--sobre-tostado:#F3E9DC;
  --acento:#B7843F;--acento-t:#8A5C22;--acento-suave:#F3E4CC;--linea:#E3D3BF;--linea2:#D2BDA4;
  --hoja:#5E7D4A;--hoja-suave:#E4EBDC;--cereza:#B5562F;--cereza-suave:#F6E1D7;--medio:#9A6B1F;--medio-suave:#F5E8CF;
  --sombra:0 1px 2px rgba(59,36,22,.07),0 6px 18px rgba(59,36,22,.06);
  --sombra-v:0 10px 40px rgba(43,26,16,.28);
  --radio:16px;--radio-s:12px;--r8:8px;--r10:10px;--r12:12px;--r16:16px;--r20:20px;--r24:24px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --f-titulo:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  --f-texto:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-tema="oscuro"]{
  --papel:#1A120C;--sup:#251A12;--sup2:#30231A;--tinta:#F3E9DC;--tinta2:#CDB9A5;--tenue:#A08B78;
  --cafe:#C69A74;--cafe-osc:#D8B08C;--sobre-cafe:#1A120C;--tostado:#120C08;--sobre-tostado:#F3E9DC;
  --acento:#D3A35E;--acento-t:#E2B878;--acento-suave:#3A2B1B;--linea:#3B2C20;--linea2:#4C3A2B;
  --hoja:#9DBB86;--hoja-suave:#24301C;--cereza:#E58D69;--cereza-suave:#3A2018;--medio:#E2B464;--medio-suave:#3A2C14;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums}
body.con-capa{overflow:hidden}
h1,h2,h3{font-family:var(--f-titulo);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.2vw,34px)}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}

<body>
<div class="app" id="app">
  <aside class="menu" id="menu">
    <div class="marca-finca" id="marcaFinca"></div>
    <nav aria-label="Menú principal" id="nav"></nav>
  </aside>
  <main class="principal" id="principal">
    <div id="isla"></div>
    <div class="contenido" id="vista"></div>
  </main>
</div>
<div id="capas"></div>
<div id="avisito" role="status" aria-live="polite"></div>
<div id="impresion"></div>
<input type="file" id="abrirArchivo" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="abrirLogo" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<script>
"use strict";
const TABLAS=["config","trabajadores","labores","lotes","asistencia","produccion","anticipos","periodos"];
const DB_NOMBRE="finca-planilla",DB_VER=1,LS_CLAVE="finca-planilla-copia";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(String(v??"").replace(/,/g,"").replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
const fmtQ=n=>{n=r2(n||0);return(n<0?"− ":"")+"Q "+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmtN=(n,d=2)=>(+n||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:d});
const fmtH=h=>fmtN(h,1);
const plano=n=>r2(n||0).toFixed(2);
const ahora=()=>new Date().toISOString();
function nuevoId(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");return`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`}

const almacen=(()=>{
  const cache={};TABLAS.forEach(t=>cache[t]=new Map());
  let idb=null,copiaPend=null;const oyentes=new Set();
  function abrir(){return new Promise(res=>{try{const rq=indexedDB.open(DB_NOMBRE,DB_VER);rq.onupgradeneeded=()=>{const d=rq.result;TABLAS.forEach(t=>{if(!d.objectStoreNames.contains(t))d.createObjectStore(t,{keyPath:"id"})})};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}})}
  function leer(d,t){return new Promise(res=>{try{const rq=d.transaction(t).objectStore(t).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([])}catch(e){res([])}})}
  function escribir(t,filas){if(!idb)return;try{const os=idb.transaction(t,"readwrite").objectStore(t);filas.forEach(f=>os.put(f))}catch(e){}}
  async function escribirTodo(){if(!idb)return;for(const t of TABLAS){await new Promise(res=>{try{const tx=idb.transaction(t,"readwrite");const os=tx.objectStore(t);os.clear();cache[t].forEach(f=>os.put(f));tx.oncomplete=res;tx.onerror=res;tx.onabort=res}catch(e){res()}})}}
  function programarCopia(){clearTimeout(copiaPend);copiaPend=setTimeout(()=>{try{localStorage.setItem(LS_CLAVE,JSON.stringify(exportar()))}catch(e){}},900)}
  async function iniciar(){
    idb=await abrir();let hay=false;
    if(idb){for(const t of TABLAS){const filas=await leer(idb,t);filas.forEach(f=>cache[t].set(f.id,f));if(filas.length)hay=true}}
    if(!hay){try{const c=JSON.parse(localStorage.getItem(LS_CLAVE)||"null");if(c&&c.datos){TABLAS.forEach(t=>(c.datos[t]||[]).forEach(f=>f&&f.id&&cache[t].set(f.id,f)));await escribirTodo()}}catch(e){}}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }
  function todos(t){const out=[];cache[t].forEach(f=>{if(!f.borrado)out.push(f)});return out}
  function uno(t,id){const f=cache[t].get(id);return f&&!f.borrado?f:null}
  function cualquiera(t,id){return cache[t].get(id)||null}
  function guardar(t,obj){const prev=cache[t].get(obj.id)||{};const f={...prev,...obj};if(!f.id)f.id=nuevoId();if(!f.creado)f.creado=ahora();f.modificado=ahora();f.borrado=!!obj.borrado;cache[t].set(f.id,f);escribir(t,[f]);programarCopia();oyentes.forEach(fn=>fn(t,f));return f}
  function borrar(t,id){const f=cache[t].get(id);if(f)guardar(t,{...f,borrado:true})}
  function exportar(){const datos={};TABLAS.forEach(t=>datos[t]=[...cache[t].values()]);return{app:"finca-planilla",version:1,fecha:ahora(),datos}}
  async function reemplazar(datos){TABLAS.forEach(t=>{cache[t].clear();(datos[t]||[]).forEach(f=>f&&f.id&&cache[t].set(f.id,f))});await escribirTodo();programarCopia();oyentes.forEach(fn=>fn("*",null))}
  function alCambiar(fn){oyentes.add(fn)}
  return{iniciar,todos,uno,cualquiera,guardar,borrar,exportar,reemplazar,alCambiar,usaIDB:()=>!!idb};
})();

const CONFIG_BASE={id:"finca",nombre:"Finca Castillo",ubicacion:"",logo:"",firmaNombre:"",firmaCargo:"Administrador(a)",minimoDiario:119.21,igssLab:4.83,igssPat:12.67,bonifMes:250,jornada:8,recargoExtra:50,diaDescanso:0,diasTrabajo:[1,2,3,4,5,6],hoja:"letter",tema:"claro",reciboSiguiente:1,ultimoRespaldo:"",ultimoLote:"",iniciado:false,avisoAnotar:true,avisoPago:true,avisoRespaldo:true,avisoCuotas:true,avisoHora:16};
let C=null,IDX=null;
const cfg=()=>C||(C={...CONFIG_BASE,...(almacen.uno("config","finca")||{})});
const guardarCfg=c=>almacen.guardar("config",{...cfg(),...c,id:"finca"});
almacen.alCambiar(t=>{if(t==="produccion"||t==="*")IDX=null;if(t==="config"||t==="*")C=null});

const DIAS_C=["dom","lun","mar","mié","jue","vie","sáb"];
const DIAS_L=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DIAS_I=["D","L","M","M","J","V","S"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hoyISO=()=>iso(new Date());
const masDias=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>pd(s).getDay();
const finMes=s=>{const d=pd(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0))};
const fmtFc=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:"";
const fmtF=s=>s?`${DIAS_C[dow(s)]} ${fmtFc(s)}`:"";
const mesTxt=s=>`${MESES[+s.slice(5,7)-1]} ${s.slice(0,4)}`;
function rango(a,b){const out=[];let s=a;while(s<=b&&out.length<800){out.push(s);s=masDias(s,1)}return out}
function inicioSemana(s){const ini=(cfg().diaDescanso+1)%7;return masDias(s,-((dow(s)-ini+7)%7))}

const ESTADOS={vino:{t:"Vino",u:1,s:"✓"},medio:{t:"Medio día",u:.5,s:"½"},no:{t:"No vino",u:0,s:"—"},permiso:{t:"Permiso",u:0,s:"P"},goce:{t:"Permiso con goce",u:1,s:"G"}};

function idx(){if(IDX)return IDX;const prod=new Map();almacen.todos("produccion").forEach(p=>{const k=p.fecha+"|"+p.trabajadorId;if(!prod.has(k))prod.set(k,[]);prod.get(k).push(p)});prod.forEach(l=>l.sort((a,b)=>(a.creado||"").localeCompare(b.creado||"")));IDX={prod};return IDX}
const prods=(f,t)=>idx().prod.get(f+"|"+t)||[];
const unidades=a=>a?(ESTADOS[a.estado]?.u||0):0;
const trabajo=a=>!!a&&(a.estado==="vino"||a.estado==="medio");
function horasDe(a){if(!trabajo(a))return 0;if(a.horas!=null&&a.horas!=="")return+a.horas;return cfg().jornada*(a.estado==="medio"?.5:1)}
function tieneRegistros(t,ini,fin){return rango(ini,fin).some(d=>asis(d,t.id)||prods(d,t.id).length)}

function datosDia(t,f){
  const c=cfg(),a=asis(f,t.id),ps=prods(f,t.id),u=unidades(a),jor=+c.jornada||8,jornal=+t.jornal||0;
  let pagoProd=0;const det=[];
  ps.forEach(p=>{const l=almacen.cualquiera("labores",p.laborId);const pr=l?precioEn(l,f):0;const m=(+p.cantidad||0)*pr;pagoProd+=m;det.push({l,p,pr,m})});
  let pago=0,base="jornal";
  if(t.tipo==="tarea"){pago=pagoProd;base="tarea";if(pago===0&&u>0&&jornal>0){pago=u*jornal;base="jornal"}}
  else pago=u*jornal;
  const h=horasDe(a),horasOrd=trabajo(a)?Math.min(h,jor*u):(a&&a.estado==="goce"?jor:0),extraH=trabajo(a)?Math.max(0,h-jor*u):0;
  return{a,u,pago,pagoProd,det,horas:h,horasOrd,extraH,base};
}
function semanaInfo(t,ini){
  const c=cfg(),dias=rango(ini,masDias(ini,6)),descanso=dias.find(d=>dow(d)===+c.diaDescanso);
  const habiles=dias.filter(d=>d!==descanso&&c.diasTrabajo.includes(dow(d))&&(!t.ingreso||d>=t.ingreso)&&(!t.baja||d<=t.baja));
  const dd={};let pago=0,u=0,trabajados=0;const faltas=[];
  dias.forEach(d=>{const x=datosDia(t,d);dd[d]=x;pago+=x.pago;u+=x.u});
  habiles.forEach(d=>{const a=dd[d].a;if(!a||a.estado==="no")faltas.push(d);if(trabajo(a))trabajados++});
  const hoy=hoyISO(),pendiente=faltas.some(d=>d>=hoy&&!dd[d].a);
  const promedio=u>0?pago/u:0,gana=habiles.length>0&&faltas.length===0&&trabajados>0;
  const monto=gana?(t.tipo==="tarea"?promedio:(+t.jornal||0)):0;
  return{ini,dias,descanso,habiles,faltas,pendiente,gana,monto,promedio,dd,pago,u};
}
function saldosAnticipos(excluir){const ap=new Map();almacen.todos("periodos").forEach(p=>{if(!p.cerrado||p.id===excluir)return;(p.filas||[]).forEach(f=>(f.aplicaciones||[]).forEach(x=>ap.set(x.anticipoId,r2((ap.get(x.anticipoId)||0)+x.monto))))});return ap}
function anticiposDe(tid,excluir){const ap=saldosAnticipos(excluir);return almacen.todos("anticipos").filter(a=>a.trabajadorId===tid).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(a=>({...a,descontado:ap.get(a.id)||0,saldo:r2((+a.monto||0)-(ap.get(a.id)||0))}))}

function calcular(t,ini,fin,op={}){
  const c=cfg(),fac=1+(+c.recargoExtra||0)/100,jor=+c.jornada||8,jornal=+t.jornal||0;
  const semanas=new Map();const sem=d=>{const i=inicioSemana(d);if(!semanas.has(i))semanas.set(i,semanaInfo(t,i));return semanas.get(i)};
  let ordinario=0,extra=0,dias=0,horasOrd=0,horasExtra=0,septimo=0,septimos=0,diasJornal=0;
  const prodU={},porLabor=new Map(),avisos=[],extraDet=[];
  const diasR=rango(ini,fin);
  diasR.forEach(d=>{
    const s=sem(d),x=s.dd[d];ordinario+=x.pago;dias+=x.u;horasOrd+=x.horasOrd;horasExtra+=x.extraH;
    if(x.base==="jornal")diasJornal+=x.u;
    if(x.extraH>0){const vh=(t.tipo==="tarea"?s.promedio:jornal)/jor;extra+=x.extraH*vh*fac;extraDet.push(`${fmtF(d)}: ${fmtH(x.extraH)} h × ${fmtQ(vh)} × ${fmtN(fac)}`)}
    x.det.forEach(({l,p,pr})=>{const u=l?l.unidad:"tarea";prodU[u]=(prodU[u]||0)+(+p.cantidad||0);if(t.tipo==="tarea"&&x.base==="tarea"){const k=(l?l.id:"?")+"|"+pr;const o=porLabor.get(k)||{n:l?l.nombre:"Tarea",u,pr,q:0};o.q+=+p.cantidad||0;porLabor.set(k,o)}});
    if(t.tipo==="tarea"&&trabajo(x.a)&&x.u>=1&&+c.minimoDiario>0&&x.pago<+c.minimoDiario)avisos.push(`${fmtF(d)}: ganó ${fmtQ(x.pago)}, debajo del mínimo del día (${fmtQ(c.minimoDiario)}).`);
  });
  const semDet=[];
  diasR.filter(d=>dow(d)===+c.diaDescanso).forEach(d=>{const s=sem(d);if(s.gana){septimo+=s.monto;septimos++}semDet.push(s)});
  const cap={semanal:7,quincenal:15,mensual:30}[op.cap||t.periodo]||30;
  const diasBonif=Math.min(dias+septimos,cap);
  ordinario=r2(ordinario);septimo=r2(septimo);extra=r2(extra);
  const bonif=r2((+c.bonifMes||0)/30*diasBonif);
  const afecto=r2(ordinario+septimo+extra);
  const igss=t.igss?r2(afecto*(+c.igssLab||0)/100):0,igssPat=t.igss?r2(afecto*(+c.igssPat||0)/100):0;
  const devengado=r2(afecto+bonif);
  let anticipos=0;const aplicaciones=[],antDet=[];
  if(op.anticipos!==false){let disp=r2(devengado-igss);anticiposDe(t.id,op.periodoId).filter(a=>a.fecha<=fin&&a.saldo>.004).forEach(a=>{const quiere=r2(+a.cuota>0?Math.min(+a.cuota,a.saldo):a.saldo),toma=r2(Math.max(0,Math.min(quiere,disp)));const nom=a.tipo==="prestamo"?"Préstamo":"Anticipo";if(toma<quiere-.004)avisos.push(`El ${nom.toLowerCase()} del ${fmtF(a.fecha)} no alcanzó a descontarse completo: faltan ${fmtQ(quiere-toma)} y quedan pendientes.`);if(toma>0){aplicaciones.push({anticipoId:a.id,monto:toma});anticipos=r2(anticipos+toma);disp=r2(disp-toma);antDet.push({c:`${nom} del ${fmtF(a.fecha)}`,d:`${a.concepto?esc(a.concepto)+" · ":""}saldo antes ${fmtQ(a.saldo)}, queda ${fmtQ(a.saldo-toma)}`,m:toma})}})}
  const totalDesc=r2(igss+anticipos),liquido=r2(devengado-totalDesc);
  const prodTxt=Object.entries(prodU).filter(([,q])=>q).map(([u,q])=>`${fmtN(q)} ${unidadTxt(u,q)}`).join(" · ");
  const des=[];
  des.push({sec:"Lo que ganó"});
  if(t.tipo==="tarea"){porLabor.forEach(o=>des.push({c:o.n,d:`${fmtN(o.q)} ${unidadTxt(o.u,o.q)} × ${fmtQ(o.pr)}`,m:o.q*o.pr}));if(diasJornal>0)des.push({c:"Días sin tarea pagados a jornal",d:`${fmtN(diasJornal)} × ${fmtQ(jornal)}`,m:diasJornal*jornal})}
  else des.push({c:"Salario ordinario",d:`${fmtN(dias)} días × ${fmtQ(jornal)}`,m:ordinario});
  if(!porLabor.size&&t.tipo==="tarea"&&!diasJornal)des.push({c:"Salario ordinario",d:"Sin tareas anotadas en el período",m:0});
  semDet.forEach(s=>des.push({c:`Séptimo · semana del ${fmtFc(s.ini)}`,d:s.gana?(t.tipo==="tarea"?`Semana completa · promedio diario ${fmtQ(s.promedio)}`:"Semana completa · un jornal"):(s.pendiente?"La semana todavía no termina":(s.faltas.length?`No se paga: faltó ${s.faltas.map(f=>DIAS_C[dow(f)]).join(", ")}`:"No trabajó esa semana")),m:s.monto}));
  if(horasExtra>0)des.push({c:"Horas extra",d:`${fmtH(horasExtra)} h · `+extraDet.join("; "),m:extra});
  des.push({c:"Bonificación incentivo",d:`${fmtQ(c.bonifMes)} ÷ 30 × ${fmtN(diasBonif)} días pagados`,m:bonif});
  des.push({c:"Total devengado",m:devengado,total:1});
  des.push({sec:"Descuentos"});
  des.push({c:"IGSS laboral",d:t.igss?`${fmtN(c.igssLab)} % de ${fmtQ(afecto)} (sin bonificación)`:"No cotiza IGSS",m:igss});
  antDet.forEach(x=>des.push(x));
  des.push({c:"Total descuentos",m:totalDesc,total:1});
  des.push({c:"Líquido a recibir",m:liquido,total:1,liq:1});
  return{trabajadorId:t.id,codigo:t.codigo||"",nombre:t.nombre,dpi:t.dpi||"",afiliacion:t.afiliacion||"",formaPago:t.formaPago||"",tipo:t.tipo,jornal,igssSi:!!t.igss,dias:r2(dias),septimos,horasOrd:r2(horasOrd),horasExtra:r2(horasExtra),prodU,prodTxt,ordinario,septimo,extra,bonif,devengado,igss,igssPat,anticipos,aplicaciones,totalDesc,liquido,desglose:des,avisos};
}

function filasPlanilla(tipo,ini,fin){const pid=periodoId(tipo,ini);return trabs().filter(t=>t.periodo===tipo&&(activoEn(t,ini,fin)||tieneRegistros(t,ini,fin))).map(t=>calcular(t,ini,fin,{periodoId:pid}))}
function sumar(filas){const k=["dias","horasOrd","horasExtra","ordinario","septimo","extra","bonif","devengado","igss","igssPat","anticipos","totalDesc","liquido"];const s={};k.forEach(x=>s[x]=r2(filas.reduce((a,f)=>a+(+f[x]||0),0)));return s}

let zCapa=100;
function ventana({titulo,cuerpo,pie="",ancho="",alCerrar,clase=""}){
  const capa=document.createElement("div");capa.className="capa";capa.style.zIndex=++zCapa;const id="vt"+zCapa;
  capa.innerHTML=`<div class="ventana ${clase}" role="dialog" aria-modal="true" aria-labelledby="${id}" style="${ancho?`max-width:${ancho}`:""}"><header class="v-cab"><h2 id="${id}">${titulo}</h2><button type="button" class="btn-x" data-cerrar title="Cerrar esta ventana sin guardar" aria-label="Cerrar">${ic("x")}</button></header><div class="v-cuerpo">${cuerpo}</div>${pie?`<footer class="v-pie">${pie}</footer>`:""}</div>`;
  const prev=document.activeElement;$("#capas").appendChild(capa);document.body.classList.add("con-capa");
  let cerrada=false;
  capa._cerrar=()=>{if(cerrada)return;cerrada=true;capa.classList.add("saliendo");setTimeout(()=>{capa.remove();if(!$("#capas").children.length)document.body.classList.remove("con-capa")},150);alCerrar&&alCerrar();if(prev&&prev.isConnected&&prev.focus)prev.focus({preventScroll:true})};
  capa.addEventListener("click",e=>{if(e.target.closest("[data-cerrar]"))capa._cerrar()});
  requestAnimationFrame(()=>{const f=capa.querySelector("[autofocus]")||capa.querySelector(".v-cuerpo input:not([type=checkbox]):not([type=radio]),.v-cuerpo select,.v-cuerpo textarea")||capa.querySelector(".v-pie .btn-primario");f&&f.focus({preventScroll:true})});

}

const TIT_EST={vino:"Vino a trabajar el día completo",medio:"Trabajó medio día",no:"No vino a trabajar",permiso:"Tuvo permiso (marque «con goce» si se le paga)"};
function opcionesLabor(sel){const ls=labores().filter(l=>l.activa!==false||l.id===sel);return ls.map(l=>`<option value="${l.id}" ${l.id===sel?"selected":""}>${esc(l.nombre)} · ${fmtQ(precioEn(l,E.fecha))} por ${unidadTxt(l.unidad,1)}</option>`).join("")}
function tareaItem(p,dis){const l=almacen.cualquiera("labores",p.laborId);const ln=loteNombre(p.lote);return`<div class="tarea" data-p="${p.id}"><select data-cambio="labor" aria-label="Tarea" ${dis}>${opcionesLabor(p.laborId)}</select><input inputmode="decimal" data-cambio="cantidad" value="${p.cantidad?fmtN(p.cantidad):""}" placeholder="0" aria-label="Cantidad" ${dis}><span class="unidad">${l?unidadTxt(l.unidad,p.cantidad||2):""}</span><button type="button" class="btn-x" data-acc="quitarTarea" title="Quitar esta tarea del día" aria-label="Quitar tarea" ${dis}>${ic("x")}</button>${ln?`<span class="lote-tag">Lote ${esc(ln)}</span>`:""}</div>`}
function ganaHoy(t,x){const c=cfg();let g=x.pago;if(t.tipo!=="tarea"&&x.extraH>0)g+=x.extraH*(+t.jornal||0)/(+c.jornada||8)*(1+(+c.recargoExtra||0)/100);return g}
function ganoHtml(t,x){const c=cfg(),bajo=t.tipo==="tarea"&&trabajo(x.a)&&x.u>=1&&+c.minimoDiario>0&&x.pago<+c.minimoDiario;return`<span class="lbl">Gana hoy</span><b>${fmtQ(ganaHoy(t,x))}</b>${bajo?`<span class="bajo">Debajo del mínimo (${fmtQ(c.minimoDiario)})</span>`:""}${t.tipo==="tarea"&&x.extraH>0?`<span class="lbl">Las extras se suman en Pagar</span>`:""}`}
function horasHtml(x,dis){return trabajo(x.a)?`<span class="lbl">Horas</span><div class="paso"><button type="button" data-acc="horas" data-d="-1" title="Una hora menos" aria-label="Una hora menos" ${dis}>−</button><input inputmode="decimal" value="${fmtH(x.horas)}" data-cambio="horas" aria-label="Horas trabajadas" ${dis}><button type="button" data-acc="horas" data-d="1" title="Una hora más (lo de arriba de la jornada cuenta como extra)" aria-label="Una hora más" ${dis}>+</button></div><span class="extra">${x.extraH>0?`${fmtH(x.extraH)} h extra`:""}</span>`:`<span class="lbl">Horas</span><span class="tenue">—</span>`}
function filaHoy(t,f){
  const a=asis(f,t.id),x=datosDia(t,f),cerr=estaCerrado(t,f),dis=cerr?"disabled":"",est=a?a.estado:"",ps=prods(f,t.id);
  return`<article class="fila-hoy ${est?"e-"+est:""} ${cerr?"cerrada":""}" data-t="${t.id}" data-texto="${esc(textoBusq(t.nombre,t.codigo||""))}"><div class="fh">

function refrescarFila(tid,parcial){const row=$(`.fila-hoy[data-t="${tid}"]`),t=almacen.uno("trabajadores",tid);if(!row||!t)return;if(parcial){const x=datosDia(t,E.fecha);$(".gano",row).innerHTML=ganoHtml(t,x);const ex=$(".horas .extra",row);if(ex)ex.textContent=x.extraH>0?`${fmtH(x.extraH)} h extra`:"";$$(".tarea",row).forEach(d=>{const p=almacen.uno("produccion",d.dataset.p);const l=p&&almacen.cualquiera("labores",p.laborId);if(l)$(".unidad",d).textContent=unidadTxt(l.unidad,p.cantidad||2)})}else{const tmp=document.createElement("div");tmp.innerHTML=filaHoy(t,E.fecha);const nuevo=tmp.firstElementChild;nuevo.hidden=row.hidden;row.replaceWith(nuevo)}pintarTotalesDia()}
function pintarTotalesDia(){const box=$("#totalesDia");if(!box)return;const f=E.fecha,lista=trabs().filter(t=>activoEn(t,f,f)||asis(f,t.id)||prods(f,t.id).length);let pres=0,total=0;const u={};lista.forEach(t=>{const x=datosDia(t,f);if(trabajo(x.a))pres++;total+=ganaHoy(t,x);x.det.forEach(({l,p})=>{if(l)u[l.unidad]=(u[l.unidad]||0)+(+p.cantidad||0)})});const lib=(u.libra||0)+(u.quintal||0)*100;const partes=[`<div class="dato"><span>Vinieron</span><b>${pres} de ${lista.length}</b></div>`];if(lib)partes.push(`<div class="dato"><span>Café cortado</span><b>${fmtN(lib)} lb</b></div>`);["caja","canasto","cuerda","surco","tarea"].forEach(k=>{if(u[k])partes.push(`<div class="dato"><span>${unidadTxt(k,2).replace(/^./,m=>m.toUpperCase())}</span><b>${fmtN(u[k])}</b></div>`)});partes.push(`<div class="dato grande"><span>Se ganó hoy</span><b>${fmtQ(total)}</b></div>`);box.innerHTML=partes.join("")}
function pintarMarcados(){const b=$("#barraMarcados");if(!b)return;const n=E.marcados.size,dis=n?"":`disabled title="Marque al menos un trabajador"`;b.innerHTML=`<span class="cuantos">${n?`${n} marcado${n>1?"s":""}:`:"Para los marcados:"}</span>${["vino","medio","no"].map(k=>`<button type="button" class="btn btn-chico" data-acc="estadoVarios" data-e="${k}" ${dis||`title="Poner «${ESTADOS[k].t}» a los ${n} marcados"`}>${ESTADOS[k].t}</button>`).join("")}`}

const filtroFechas=()=>`<label class="campo"><span>Desde</span><input class="inp" type="date" value="${E.repDesde}" data-cambio="repDesde"></label><label class="campo"><span>Hasta</span><input class="inp" type="date" value="${E.repHasta}" data-cambio="repHasta"></label><div class="chips">${[["semana","Esta semana"],["quincena","Esta quincena"],["mes","Este mes"],["mespasado","Mes pasado"],["cosecha","Cosecha"]].map(([k,t])=>`<button type="button" class="chip" data-acc="repRango" data-k="${k}" title="${k==="cosecha"?"Desde el 1 de agosto hasta hoy":"Poner las fechas de "+t.toLowerCase()}">${t}</button>`).join("")}</div>`;

const REPORTES={
  asistencia(){

    const tabla=`<table class="asis-tabla"><thead><tr><th style="text-align:left">Trabajador</th>${dias.map(x=>`<th class="${des(x)}">${DIAS_I[dow(x)]}<br>${+x.slice(8)}</th>`).join("")}<th>Días</th><th>Horas</th><th>Extra</th></tr></thead><tbody>${filas.map(f=>`<tr><td class="n">${esc(f.t.nombre)}</td>${f.cel.map(({x,a,z})=>`<td class="${des(x)}">${sim(a,z)}</td>`).join("")}<td class="t">${fmtN(f.u)}</td><td class="t">${fmtH(f.hs)}</td><td class="t">${f.ex?fmtH(f.ex):""}</td></tr>`).join("")}</tbody><tfoot><tr><td class="n">Vinieron</td>${porDia.map((n,i)=>`<td class="${des(dias[i])}"><b>${n||""}</b></td>`).join("")}<td class="t">${fmtN(filas.reduce((s,f)=>s+f.u,0))}</td><td class="t">${fmtH(filas.reduce((s,f)=>s+f.hs,0))}</td><td class="t">${fmtH(filas.reduce((s,f)=>s+f.ex,0))}</td></tr></tfoot></table>`;
    const tarj=`<div class="asis-tarj">${filas.map(f=>`<article><div class="cab-t"><b>${esc(f.t.nombre)}</b><span>${fmtN(f.u)} días · ${fmtH(f.hs)} h${f.ex?` · ${fmtH(f.ex)} h extra`:""}</span></div><div class="dias">${f.cel.map(({x,a,z})=>`<div class="d ${des(x)}">${DIAS_C[dow(x)]} ${+x.slice(8)}<b>${a?`<span class="s-${a.estado}">${ESTADOS[a.estado].s}</span>`:"&nbsp;"}</b></div>`).join("")}</div></article>`).join("")}</div>`;
    const ley=`<div class="leyenda"><span>✓ Vino</span><span>½ Medio día</span><span>— No vino</span><span>P Permiso</span><span>G Permiso con goce</span><span>Columna sombreada: día de descanso</span></div>`;

    return{filtros,html,imp:`${tabla}${ley}`,horizontal:true,titulo:"Asistencia",sub:`del ${fmtF(d)} al ${fmtF(dias[dias.length-1])}`,archivo:`asistencia-${d}-a-${h}.csv`,csv:()=>[["Trabajador",...dias.map(fmtFc),"Días","Horas","Horas extra"],...filas.map(f=>[f.t.nombre,...f.cel.map(({a,z})=>a?ESTADOS[a.estado].s+(trabajo(a)?` ${fmtH(z.horas)}h`:""):""),f.u,f.hs,f.ex])]};

  produccion(){
    const d=E.repDesde,h=E.repHasta,dias=rango(d,h),c=cfg();const filtros=filtroFechas();

    const lb=(u,q)=>u==="libra"?q:u==="quintal"?q*100:0;

function seccionTelefono(c){const titulo=`<h2>En el teléfono</h2>`;if(!enWeb)return`<section class="tarjeta">${titulo}<p>Para instalarla como app y recibir notificaciones, ábrala desde <b>studiomonterroso.com/FincaCastillo</b> en el teléfono.</p></section>`;const inst=instalada()?`<p class="tel-linea">${ic("ok")} Ya está instalada como app en este aparato.</p>`:PWA.instalar?`<div class="fila-botones"><button type="button" class="btn btn-primario" data-acc="instalar" title="Poner la planilla en la pantalla del teléfono como una app">${ic("subir")} Instalar como app</button></div>`:`<p class="historial">Para instalarla: en Chrome toque el menú ⋮ y luego «Agregar a la pantalla principal» o «Instalar app».</p>`;const per=permisoAvisos();let avisos;if(per==="granted"){const ck=(k,t,d)=>`<label class="casilla tel-casilla"><input type="checkbox" data-cambio="avisoTipo" data-k="${k}" ${c[k]!==false?"checked":""}> <span><b>${t}</b><small>${d}</small></span></label>`;avisos=`<p class="tel-linea">${ic("ok")} Notificaciones activadas.</p><div class="tel-lista">${ck("avisoAnotar","Anotar el día","Si a la hora de abajo todavía no se anotó quién vino. Solo días de trabajo.")}${ck("avisoPago","Día de pago","El último día de trabajo de cada semana, quincena o mes.")}${ck("avisoCuotas","Cuotas de préstamo","Quién lleva cuota ese día de pago.")}${ck("avisoRespaldo","Respaldo","Una vez por semana si no se ha guardado.")}</div><label class="campo tel-hora"><span>Recordar anotar el día desde las</span><select data-cambio="avisoHora">${[12,13,14,15,16,17,18,19].map(h=>`<option value="${h}" ${(+c.avisoHora||16)===h?"selected":""}>${h-12||12}:00 p. m.</option>`).join("")}</select></label><p class="historial">Llegan más o menos una vez al día y Android decide la hora exacta. Funcionan mejor con la app instalada. También se revisan cada vez que sale de la app.</p>`}else if(per==="denied"){avisos=`<p class="historial">Las notificaciones están bloqueadas. Se activan en Chrome › Configuración del sitio › Notificaciones.</p>`}else if(per==="no"){avisos=`<p class="historial">Este navegador no puede mandar notificaciones.</p>`}else{avisos=`<p style="margin-bottom:14px">Avisos para anotar el día, el día de pago, las cuotas de préstamo y el respaldo.</p><div class="fila-botones"><button type="button" class="btn btn-primario" data-acc="avisosActivar" title="Pedir permiso para mandar notificaciones a este teléfono">${ic("aviso")} Activar notificaciones</button></div>`}return`<section class="tarjeta">${titulo}<div class="tel-bloque">${inst}</div><h3 class="tel-sub">Notificaciones</h3>${avisos}</section>`}
ACC.instalar=async()=>{const e=PWA.instalar;if(!e)return;e.prompt();try{await e.userChoice}catch(x){}PWA.instalar=null;pintar()};
ACC.avisosActivar=async()=>{if(!("Notification" in window))return;let p="default";try{p=await Notification.requestPermission()}catch(x){}if(p==="granted"){navigator.storage&&navigator.storage.persist&&navigator.storage.persist();await publicarAvisos(false);await programarAvisos();const r=await navigator.serviceWorker.ready;r.active&&r.active.postMessage("prueba");avisito("Notificaciones activadas")}pintar()};
CAMBIO.avisoTipo=el=>{guardarCfg({[el.dataset.k]:el.checked});publicarAvisos();avisito("Guardado")};
CAMBIO.avisoHora=el=>{guardarCfg({avisoHora:+el.value});publicarAvisos();avisito("Guardado")};
